<style>
:root{
  --bg:#070707;
  --card:#111010;
  --surface:#1a1a1a;
  --text:#F7F3EE;
  --muted:#A9A29A;
  --gold:#F5B800;
  --gold-soft:#FFD54F;
  --ink:#000000;
  --line:rgba(255,255,255,.09);
  --r:18px;
  --display:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --accent:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--display);
  background:var(--bg);
  color:var(--text);
  font-size:17px;
  line-height:1.4;
}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.logo{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:0 0 14px -2px rgba(245,184,0,.55)}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--gold);color:var(--ink)}
.bar{height:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .35s ease}
.nav{display:flex;justify-content:space-between;align-items:center;height:36px;color:var(--muted);font-size:14px}
.back{border:0;background:none;font:inherit;font-size:15px;color:var(--text);font-weight:600;padding:6px 0;cursor:pointer}
.back[hidden]{visibility:hidden;display:block}
main{flex:1;display:flex;flex-direction:column}
.screen{animation:in .28s ease both;display:flex;flex-direction:column;flex:1}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.15;margin:18px 0 12px;letter-spacing:-.035em;font-weight:800}
h2{font-size:24px;line-height:1.22;margin:14px 0 6px;letter-spacing:-.03em;font-weight:800}
.hint{color:var(--muted);margin:0 0 16px;font-size:15px}
.hero{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px 22px;
  margin-top:10px;
  position:relative;
  overflow:hidden;
  box-shadow:0 -20px 60px -30px rgba(245,184,0,.18);
}
.hero:after{content:"";position:absolute;right:-50px;bottom:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,184,0,.28),rgba(245,184,0,0));pointer-events:none}
.hero p{margin:0 0 10px;font-size:18px;position:relative;z-index:1}
.hero .big{
  font-family:var(--accent);
  font-style:italic;
  font-weight:400;
  font-size:32px;
  line-height:1.15;
  margin:0 0 14px;
  letter-spacing:-.02em;
  color:var(--gold);
  position:relative;z-index:1;
}
.hero p:last-child{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--text)}
.meta{color:var(--muted);font-size:14px;margin:6px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;font:inherit;font-size:18px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;transition:transform .08s,border-color .15s,background .15s,color .15s}
.opt:active{transform:scale(.98)}
.opt .ic{font-size:22px;width:28px;text-align:center}
.opt.sel{border-color:var(--gold);background:var(--gold);color:var(--ink)}
.opt .ck{color:transparent;margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px;flex:none}
.opt.sel .ck{background:var(--ink);border-color:var(--ink);color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{justify-content:center;text-align:center}
input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:18px;padding:15px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);outline:none;caret-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,0,.22)}
textarea{min-height:96px;resize:vertical}
label.small{display:block;font-weight:700;font-size:15px;margin:16px 0 8px}
.cta{margin-top:auto;padding-top:18px}
.btn{
  width:100%;min-height:58px;border:0;border-radius:999px;
  background:var(--gold);color:var(--ink);
  font:inherit;font-size:18px;font-weight:800;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,213,79,.4) inset,0 10px 30px -10px rgba(245,184,0,.55);
}
.btn.y{background:var(--gold);color:var(--ink)}
.btn:hover{background:var(--gold-soft)}
.btn:disabled{opacity:.35;box-shadow:none}
.link{display:block;width:100%;text-align:center;background:none;border:0;font:inherit;color:var(--muted);padding:14px;font-size:15px;text-decoration:underline;cursor:pointer}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--muted);cursor:pointer}
.consent input{width:24px;height:24px;flex:none;accent-color:var(--gold);margin:0}
.thanks{text-align:center;justify-content:center}
.thanks .big{font-size:64px;margin-bottom:4px}
.err{color:#FF6B7A;font-size:14px;margin-top:10px;min-height:1em}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
.share{display:flex;gap:10px;margin-top:22px}
.share .btn{font-size:16px}
/* v2 additions */
.opts.compact .opt{min-height:50px;font-size:16px;padding:10px 14px}
.concept .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;position:relative;z-index:1}
.concept .big{font-size:30px}
.concept .benefit{font-size:17px;font-weight:600;color:var(--text);margin:0 0 10px}
.concept .shared{font-size:15px;color:var(--muted);margin:0}
.rq{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 8px;font-weight:700;font-size:16px}
.rq em{font-style:normal;color:var(--gold);font-weight:600;font-size:14px;white-space:nowrap}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{justify-content:center;text-align:center;min-height:48px;padding:8px 0;font-size:17px}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:5px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.pill.sel{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.opts.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.opts.grid3 .opt{justify-content:center;text-align:center;min-height:50px;font-size:16px;padding:8px 4px}
select{width:100%;font:inherit;font-size:18px;padding:15px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);outline:none;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,0,.22)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reveal{margin:20px 0 0;font-family:var(--accent);font-style:italic;font-size:26px;line-height:1.2;color:var(--gold)}
.opt .q8{font-weight:600}
</style>
</head>

const LABEL={moved_when:"o1",lack_people_freq:"o2",last_time_action:"o3",tools_used:"o4",tools_problem:"o5",new_skill:"o6",
 intent:"o9",wtp:"o10",host:"o11",age:"oAge",situation:"oSit",gender:"oGen",appeal:"sA",clarity:"sC",download:"sD"};
const TOP_COUNTRIES=["FR","GB","ES","LV"];
const COUNTRIES="AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI CV KH CM CA CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HK HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI XK KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG KP MK NO OM PK PW PS PA PG PY PE PH PL PT PR QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA KR SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW".split(" ");
const qs=new URLSearchParams(location.search);
const IS_TEST=qs.get("test")==="1";
const SOURCE=(qs.get("src")||qs.get("utm_source")||"").slice(0,40);
// --- variant (set on page load, before the intro) ---
const VARIANTS=["A","B","C","D"];
function rnd(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
let variant=(qs.get("v")||"").toUpperCase(),variantForced=VARIANTS.includes(variant);
if(!variantForced){variant=load("mx_v2_variant");if(!VARIANTS.includes(variant)){variant=VARIANTS[rnd(4)];store("mx_v2_variant",variant)}}
let pickOrder=load("mx_v2_pick_order");
if(!pickOrder||pickOrder.length!==4||[...pickOrder].sort().join("")!=="ABCD"){
 const a=VARIANTS.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}
 pickOrder=a.join("");store("mx_v2_pick_order",pickOrder)}
const SID=crypto.randomUUID?crypto.randomUUID():String(Date.now())+"-"+rnd(1e9);
let lang=load("mx_lang")||((navigator.language||"").toLowerCase().startsWith("fr")?"fr":"en");
if(qs.get("lang")==="fr"||qs.get("lang")==="en")lang=qs.get("lang");
const A={tools_used:[],situation:[]};
let step=0,startedAt=0,conceptMs=0,conceptEnter=0,startedSent=false;
const $=s=>document.querySelector(s);const t=k=>T[lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function screens(){const s=["q1","q2","q3","q4","q5","q6","q7","q8","q9","q10","q11","q12","q13","q14"];
 return A.tools_used.includes("none")?s.filter(x=>x!=="q5"):s}  // Q5 only if they used a tool
function cur(){const s=screens();return step===0?"intro":step>s.length?"thanks":s[step-1]}
function setLang(l){lang=l;store("mx_lang",l);render(false)}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("#back").onclick=()=>{if(step>1)go(step-1)};
function go(n){const was=cur();if(was==="q7"&&conceptEnter){conceptMs+=Date.now()-conceptEnter;conceptEnter=0}
 step=n;if(cur()==="q7")conceptEnter=Date.now();render();window.scrollTo(0,0)}
function labels(key){return t(LABEL[key])}
function single(key,extra=""){const L=labels(key);return `<div class="opts ${extra}">`+V[key].map((v,i)=>
 `<button class="opt ${A[key]===v?"sel":""}" data-k="${key}" data-i="${i}"><span>${esc(L[i])}</span></button>`).join("")+"</div>"}
function multi(key){const L=labels(key);return `<div class="opts compact">`+V[key].map((v,i)=>
 `<button class="opt ${A[key].includes(v)?"sel":""}" data-m="${key}" data-i="${i}"><span>${esc(L[i])}</span><span class="ck">✓</span></button>`).join("")+"</div>"}
function pills(key,isMulti){const L=labels(key);return `<div class="pills">`+V[key].map((v,i)=>{const on=isMulti?A[key].includes(v):A[key]===v;
 return `<button class="pill ${on?"sel":""}" ${isMulti?"data-m":"data-p"}="${key}" data-i="${i}">${esc(L[i])}</button>`}).join("")+"</div>"}
function scale(key,qk){const L=labels(key);const sel=A[key];return `<div class="rq"><span>${esc(t(qk))}</span><em>${sel?esc(L[sel-1]):""}</em></div>
 <div class="scale" role="group" aria-label="${esc(t(qk))}">`+V[key].map((v,i)=>`<button class="opt ${sel===v?"sel":""}" data-s="${key}" data-i="${i}" aria-label="${esc(L[i])}">${v}</button>`).join("")+
 `</div><div class="ends"><span>${esc(L[0])}</span><span>${esc(L[4])}</span></div>`}
function otherBox(id,show,val){return `<div id="${id}Box" ${show?"":"hidden"}><input type="text" id="${id}" maxlength="200" style="margin-top:10px" placeholder="${esc(t("otherPh"))}" value="${esc(val||"")}"></div>`}
function nextBtn(enabled){return `<div class="cta"><button class="btn" id="nx" ${enabled?"":"disabled"}>${esc(t("next"))}</button></div>`}
function countryOptions(){let dn=null;try{dn=new Intl.DisplayNames([lang],{type:"region"})}catch(e){}
 const nm=c=>dn?dn.of(c):c;const rest=COUNTRIES.filter(c=>!TOP_COUNTRIES.includes(c)).map(c=>[c,nm(c)]).sort((a,b)=>a[1].localeCompare(b[1],lang));
 const o=(c,n)=>`<option value="${c}" ${A.country===c?"selected":""}>${esc(n)}</option>`;
 return `<option value="" ${A.country?"":"selected"} disabled>${esc(t("countryPh"))}</option>`+TOP_COUNTRIES.map(c=>o(c,nm(c))).join("")+`<option disabled>──────────</option>`+rest.map(([c,n])=>o(c,n)).join("")}
function render(anim=true){
 document.documentElement.lang=lang;document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
 const S=screens(),N=S.length,id=cur(),inQ=step>=1&&step<=N;$("#prog").hidden=!inQ;
 if(inQ){$("#barI").style.width=((step-1)/N*100+4)+"%";$("#count").textContent=`${step} ${t("of")} ${N}`;$("#back").style.visibility=step>1?"visible":"hidden"}
 let h="";
 if(id==="intro")h=`<div class="hero"><p>${esc(t("intro1"))}</p><div class="big">${esc(t("intro2"))}</div><p style="font-size:16px;margin:0">${esc(t("meta"))}</p></div>
  <div class="cta"><button class="btn" id="go">${esc(t("start"))}</button><div class="foot">${esc(t("foot"))}</div></div>`;
 else if(id==="q1")h=`<h2>${esc(t("q1"))}</h2><div class="hint">&nbsp;</div>${single("moved_when")}`;
 else if(id==="q2")h=`<h2>${esc(t("q2"))}</h2><div class="hint">&nbsp;</div>${single("lack_people_freq")}`;
 else if(id==="q3")h=`<h2>${esc(t("q3"))}</h2><div class="hint">&nbsp;</div>${single("last_time_action","compact")}
  ${otherBox("lastOther",A.last_time_action==="other",A.last_time_other)}${A.last_time_action==="other"?nextBtn(true):""}`;
 else if(id==="q4")h=`<h2>${esc(t("q4"))}</h2><p class="hint">${esc(t("multi"))}</p>${multi("tools_used")}
  ${otherBox("toolsOther",A.tools_used.includes("other"),A.tools_other)}${nextBtn(A.tools_used.length)}`;
 else if(id==="q5")h=`<h2>${esc(t("q5"))}</h2><div class="hint">&nbsp;</div>${single("tools_problem","compact")}
  ${otherBox("probOther",A.tools_problem==="other",A.tools_problem_other)}${A.tools_problem==="other"?nextBtn(true):""}`;
 else if(id==="q6")h=`<h2>${esc(t("q6"))}</h2><div class="hint">&nbsp;</div>${single("new_skill")}`;
 else if(id==="q7"){const c=CARDS[variant][lang];
  h=`<div class="hero concept" data-variant="${variant}"><div class="tag">${esc(t("conceptTag"))}</div><div class="big">${esc(c[0])}</div><p class="benefit">${esc(c[1])}</p><p class="shared">${esc(t("shared"))}</p></div>
  ${scale("appeal","rA")}${scale("clarity","rC")}${scale("download","rD")}${nextBtn(A.appeal&&A.clarity&&A.download)}`}
 else if(id==="q8"){const o=[...pickOrder].map(k=>`<button class="opt ${A.pick_best===k?"sel":""}" data-pick="${k}"><span class="q8">${esc(CARDS[k][lang][0])}</span></button>`).join("");
  h=`<h2>${esc(t("q8"))}</h2><div class="hint">&nbsp;</div><div class="opts">${o}<button class="opt ${A.pick_best==="none"?"sel":""}" data-pick="none"><span>${esc(t("none8"))}</span></button></div>`}
 else if(id==="q9")h=`<h2>${esc(t("q9"))}</h2><div class="hint">&nbsp;</div>${single("intent","compact")}`;
 else if(id==="q10")h=`<h2 style="font-size:21px">${esc(t("q10"))}</h2><div class="hint">&nbsp;</div>${single("wtp")}`;
 else if(id==="q11")h=`<h2>${esc(t("q11"))}</h2><div class="hint">&nbsp;</div>${single("host")}`;
 else if(id==="q12")h=`<h2>${esc(t("q12"))}</h2><p class="hint">${esc(t("q12h"))}</p><textarea id="describe" maxlength="500" placeholder="${esc(t("q12ph"))}">${esc(A.describe||"")}</textarea>${nextBtn(true)}`;
 else if(id==="q13")h=`<h2>${esc(t("q13"))}</h2>
  <label class="small">${esc(t("age"))}</label>${pills("age",false)}
  <label class="small">${esc(t("sit"))} <span style="color:var(--muted);font-weight:400">${esc(t("sitH"))}</span></label>${pills("situation",true)}
  <label class="small">${esc(t("gen"))} <span style="color:var(--muted);font-weight:400">${esc(t("genH"))}</span></label>${pills("gender",false)}
  <div id="genSelfBox" ${A.gender==="self_describe"?"":"hidden"}><input type="text" id="genSelf" maxlength="80" style="margin-top:10px" placeholder="${esc(t("genSelfPh"))}" value="${esc(A.gender_self||"")}"></div>
  <label class="small">${esc(t("where"))}</label><div class="row2"><input type="text" id="city" maxlength="80" autocomplete="address-level2" placeholder="${esc(t("cityPh"))}" value="${esc(A.city||"")}"><select id="country" autocomplete="country">${countryOptions()}</select></div>
  ${nextBtn(!!A.age)}`;
 else if(id==="q14")h=`<h2>${esc(t("q14"))}</h2><p class="hint">${esc(t("q14h"))}</p>
  <input type="email" id="email" inputmode="email" autocomplete="email" placeholder="${esc(t("emailPh"))}" value="${esc(A.email||"")}">
  <label class="consent"><input type="checkbox" id="cons" ${A.consent?"checked":""}><span>${esc(t("consent"))}</span></label>
  <div class="err" id="err"></div>
  <div class="cta"><button class="btn y" id="send">${esc(t("send"))}</button><button class="link" id="skip">${esc(t("skip"))}</button></div>`;
 else h=`<div class="thanks screen"><div class="big">🌼</div><h1>${esc(t("thx"))}</h1><p class="hint" style="font-size:17px">${esc(t("thx2"))}</p>
  <div class="reveal">${esc(t("reveal"))}</div>
  <div class="share"><button class="btn y" id="share">${esc(t("shareBtn"))}</button></div><div class="foot" id="cp"></div></div>`;
 $("#main").innerHTML=`<div class="screen" data-screen="${id}" style="${anim?"":"animation:none"}">${h}</div>`;
 bind();
}
const AUTO_HOLD={last_time_action:"other",tools_problem:"other"};
function bind(){
 const g=$("#go");if(g)g.onclick=()=>{if(!startedAt)startedAt=Date.now();sendStarted();go(1)};
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=V[k][+b.dataset.i];A[k]=v;
  document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.toggle("sel",x===b));
  if(AUTO_HOLD[k]===v){render(false);const o=document.querySelector("#main input[type=text]");if(o)o.focus();return}
  setTimeout(()=>go(step+1),220)});
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{A.pick_best=b.dataset.pick;
  document.querySelectorAll("[data-pick]").forEach(x=>x.classList.toggle("sel",x===b));setTimeout(()=>go(step+1),220)});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s;A[k]=V[k][+b.dataset.i];const y=window.scrollY;render(false);window.scrollTo(0,y)});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p;A[k]=V[k][+b.dataset.i];const y=window.scrollY;render(false);window.scrollTo(0,y)});
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const k=b.dataset.m,v=V[k][+b.dataset.i];let a=A[k];
  if(k==="tools_used"&&v==="none"){A[k]=a.includes("none")?[]:["none"]}
  else{if(k==="tools_used")a=a.filter(x=>x!=="none");const j=a.indexOf(v);j<0?a.push(v):a.splice(j,1);A[k]=a}
  const y=window.scrollY;render(false);window.scrollTo(0,y)});
 const inp=(sel,key)=>{const e=$(sel);if(e)e.oninput=()=>A[key]=e.value.trim()};
 inp("#lastOther","last_time_other");inp("#toolsOther","tools_other");inp("#probOther","tools_problem_other");
 inp("#describe","describe");inp("#genSelf","gender_self");inp("#city","city");
 const c=$("#country");if(c)c.onchange=()=>A.country=c.value;
 const nx=$("#nx");if(nx)nx.onclick=()=>go(step+1);
 const s=$("#send");if(s)s.onclick=()=>finish(true);
 const sk=$("#skip");if(sk)sk.onclick=()=>finish(false);
 const sh=$("#share");if(sh)sh.onclick=async()=>{const url=location.origin+location.pathname;
  try{if(navigator.share){await navigator.share({title:"Meet & Explore",url});return}}catch(e){return}
  try{await navigator.clipboard.writeText(url);$("#cp").textContent=t("copied")}catch(e){$("#cp").textContent=url}};
 const e=$("#email");if(e){e.oninput=()=>A.email=e.value.trim();$("#cons").onchange=ev=>A.consent=ev.target.checked}
}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
async function encrypt(obj){
 const der=Uint8Array.from(atob(PUBKEY),c=>c.charCodeAt(0));
 const pub=await crypto.subtle.importKey("spki",der,{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
 const key=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj)));
 const raw=await crypto.subtle.exportKey("raw",key);const ek=await crypto.subtle.encrypt({name:"RSA-OAEP"},pub,raw);
 return JSON.stringify({v:1,k:b64(ek),iv:b64(iv),c:b64(ct)});
}
async function post(body){const r=await fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body});if(!r.ok)throw new Error(r.status);return r}
// Small "started" event so drop-off per variant can be measured. Fire-and-forget, once per page load; never blocks the survey.
function sendStarted(){if(startedSent)return;startedSent=true;
 encrypt({event:"started",survey_version:SURVEY_VERSION,id:SID,started_at:new Date().toISOString(),lang,source:SOURCE,test:IS_TEST,
  variant,variant_forced:variantForced,pick_order:pickOrder}).then(post).catch(()=>{})}
async function finish(withEmail){
 const err=$("#err");err.textContent="";const em=($("#email").value||"").trim();
 if(withEmail&&em){if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){err.textContent=t("badEmail");return}
  if(!$("#cons").checked){err.textContent=t("needConsent");return}}
 if(conceptEnter){conceptMs+=Date.now()-conceptEnter;conceptEnter=0}
 let countryName=A.country||"";try{if(A.country)countryName=new Intl.DisplayNames(["en"],{type:"region"}).of(A.country)}catch(e){}
 const used=A.tools_used.length&&!A.tools_used.includes("none");
 const rec={event:"answer",survey_version:SURVEY_VERSION,id:SID,submitted_at:new Date().toISOString(),lang,source:SOURCE,test:IS_TEST,
  variant,variant_forced:variantForced,pick_order:pickOrder,
  moved_when:A.moved_when||"",lack_people_freq:A.lack_people_freq||"",
  last_time_action:A.last_time_action||"",last_time_other:A.last_time_action==="other"?(A.last_time_other||""):"",
  tools_used:A.tools_used.join("; "),tools_other:A.tools_used.includes("other")?(A.tools_other||""):"",
  tools_problem:used?(A.tools_problem||""):"",tools_problem_other:used&&A.tools_problem==="other"?(A.tools_problem_other||""):"",
  new_skill:A.new_skill||"",appeal:A.appeal||"",clarity:A.clarity||"",download:A.download||"",pick_best:A.pick_best||"",
  intent:A.intent||"",wtp:A.wtp||"",host:A.host||"",describe:A.describe||"",
  age:A.age||"",situation:A.situation.join("; "),gender:A.gender||"",gender_self:A.gender==="self_describe"?(A.gender_self||""):"",
  city:A.city||"",country:countryName,
  email:withEmail&&em?em:"",email_consent:!!(withEmail&&em&&$("#cons").checked),
  seconds_total:startedAt?Math.round((Date.now()-startedAt)/1000):"",seconds_on_concept:Math.round(conceptMs/100)/10};
 const btns=document.querySelectorAll("#send,#skip");btns.forEach(b=>b.disabled=true);$("#send").textContent=t("sending");
 try{const body=await encrypt(rec);
  try{await post(body)}catch(e){await new Promise(r=>setTimeout(r,1500));await post(body)}
  store("mx_done",rec.submitted_at);go(screens().length+1);
 }catch(e){err.textContent=t("failed");btns.forEach(b=>b.disabled=false);$("#send").textContent=t("send")}
}
render();
</script>
